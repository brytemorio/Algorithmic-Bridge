plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'application'
    id 'java'
    id 'war'
    id 'idea'

}

defaultTasks 'run'
sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17



repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()


}

dependencies {
    implementation 'org.web3j:web3j-maven-plugin:4.8.7'
    implementation 'com.wavesplatform:wavesj:1.2.3'
    implementation 'com.lmax:disruptor:3.4.4'
    implementation 'org.agrona:agrona:1.14.0'

    //implementation 'org.aeonbits.owner:owner:1.0.12'
    //implementation 'co.paralleluniverse:quasar-core:0.8.0'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'io.undertow:undertow-servlet:2.2.14.Final'
    implementation 'io.undertow:undertow-core:2.2.14.Final'
    implementation 'wf.bitcoin:bitcoin-rpc-client:1.1.0'
    implementation 'com.electronwill.night-config:json:3.6.5'
    compileOnly 'org.projectlombok:lombok:1.18.22'
    annotationProcessor 'org.projectlombok:lombok:1.18.22'
    testCompileOnly 'org.projectlombok:lombok:1.18.22'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.22'



    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.2'
    testImplementation 'org.assertj:assertj-core:3.22.0'

    // This dependency is used by the application.
    implementation 'com.google.guava:guava:31.0.1-jre'
}


application {
    // Define the main class for the application.
    mainClass = 'bridge.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

